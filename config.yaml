# ---- Amazon Associates ----
associate_tag: "universeofsma-21"
marketplace: "www.amazon.in"

# ---- Channel ----
channel_name: "Universe of Smart Pluto"
niche: "smartphones and smartphone accessories"
currency: "Rs"

# ---- Video format ----
long_form:
  target_minutes: 9              # start here; stretch to 14 once retention data supports it
  products: 8
  seconds_per_product: 55
short_form:
  target_seconds: 30
  products: 1                    # one product per Short converts far better than a montage

# ---- Upload cadence ----
uploads_per_day: 2               # 1 long + 1 short. Raise only after month 1.
upload_times_ist: ["09:00", "19:30"]

# ---- Compliance (do not disable) ----
disclosure: "As an Amazon Associate I earn from qualifying purchases."
price_caveat: "Prices and discounts correct at time of recording. Check the link for the current price."
require_real_discount: true      # blocks publish if a product's discount field is empty/fabricated
